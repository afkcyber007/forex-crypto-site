# =====================================================================
#  ONE-FILE INSTALLER + PUBLISHER for the Forex & Crypto website
#  Put this file in your GitHub repository at:  .github/workflows/deploy.yml
#  First run: unpacks the whole project into your repository, creates the
#  images, builds all pages and publishes them on GitHub Pages.
#  After that: every change you make (e.g. config.json) re-publishes the site.
# =====================================================================
name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly rebuild keeps the year in titles current

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

