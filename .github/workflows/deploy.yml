# =====================================================================
#  ONE-FILE INSTALLER + UPDATER + PUBLISHER for the Forex & Crypto website
#  Location in your GitHub repository:  .github/workflows/deploy.yml
#  - New repository: unpacks the whole project, creates images, publishes.
#  - Existing repository: updates all project files to version 2026-11-10,
#    but KEEPS your own config.json (site name, Telegram links, email).
#  - After that, every change you make re-publishes the site automatically.
# =====================================================================
name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly rebuild keeps the year in titles current

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install or update project files
        run: |
          VERSION="2026-11-10"
          if [ -f build.py ] && [ "$(cat .site-version 2>/dev/null)" = "$VERSION" ]; then echo "Project is up to date ($VERSION)."; exit 0; fi
          rm -f /tmp/config.keep
          if [ -f config.json ]; then cp config.json /tmp/config.keep; fi
