# =====================================================================
#  ONE-FILE INSTALLER + UPDATER + PUBLISHER for the Forex & Crypto website
#  Location in your GitHub repository:  .github/workflows/deploy.yml
#  - New repository: unpacks the whole project, creates images, publishes.
#  - Existing repository: updates all project files to version 2026-11-10b.
#    Your own config.json values are KEPT; new settings are added to it.
#  - Rebuilds on the 1st of every month, so the year in titles updates
#    automatically (and the monthly save keeps the schedule active).
# =====================================================================
name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 0 1 * *"   # 00:05 UTC on the 1st of every month (incl. 1 January)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install or update project files
        run: |
          VERSION="2026-11-10b"
          if [ -f build.py ] && [ "$(cat .site-version 2>/dev/null)" = "$VERSION" ]; then echo "Project is up to date ($VERSION)."; exit 0; fi
          rm -f /tmp/config.keep
