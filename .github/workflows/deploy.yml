          BUNDLE
          tar -xJf /tmp/project.tar.xz
          rm -f /tmp/project.tar.xz
          if [ -f /tmp/config.keep ]; then
            python3 - <<'MERGE'
          import json
          new = json.load(open("config.json"))
          mine = json.load(open("/tmp/config.keep"))
          for k, v in new.items():
              mine.setdefault(k, v)
          json.dump(mine, open("config.json", "w"), ensure_ascii=False, indent=2)
          print("Kept your config.json and added any new settings")
          MERGE
          fi
          echo "$VERSION" > .site-version
          echo "Installed version $VERSION"

      - name: Monthly blog articles (automatic)
        run: python tools/monthly_content.py

      - name: Create images (only missing ones)
        run: |
          sudo apt-get install -y -q fonts-dejavu-core >/dev/null || true
          pip install -q pillow
          python tools/make_images.py
          if [ ! -f assets/og-image.png ]; then python tools/make_og_image.py; fi

      - name: Save project files into the repository
        run: |
          date -u +%Y-%m > .last-build
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Update website files"
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build.py

      - name: Find new or changed pages (IndexNow)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/indexnow.py prepare

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: _indexnow
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
          path: _indexnow
      - name: Tell Bing about new and changed pages (IndexNow)
        run: |
          sleep 20
          python3 tools/indexnow.py submit
      - name: Remember submitted pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/indexnow_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "IndexNow: remember submitted pages"
          git pull --rebase -q || true
          git push || echo "Could not save; pages will simply be re-sent next time."
