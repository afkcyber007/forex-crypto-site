      - name: Monthly blog articles (automatic)
        run: python tools/monthly_content.py

      - name: Create images (only missing ones)
        run: |
          sudo apt-get install -y -q fonts-dejavu-core >/dev/null || true
          pip install -q pillow
          python tools/make_images.py
          if [ ! -f assets/og-image.png ]; then python tools/make_og_image.py; fi

      - name: Save project files into the repository
        run: |
          date -u +%Y-%m > .last-build
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Update website files"
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
